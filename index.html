<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Winter Holiday Planner — Lightship Chartering Genova</title>
<meta name="theme-color" content="#efefed" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="desk">
    <header class="top">
      <h1 class="sr-only">Lightship Chartering Genova — holiday planner, winter 2026–27</h1>
      <span class="brand" aria-hidden="true"></span>
      <nav class="months" id="months" aria-label="Choose month"></nav>
      <div class="right">
        <p id="me" class="me" hidden></p>
      </div>
    </header>

    <section class="pad" id="pad">
      <div class="glue" aria-hidden="true"></div>
      <div class="sheets" id="sheets">
        <div class="sheet" id="sheet"></div>
      </div>

      <!-- A toy plane that wanders around the calendar, never parking on anyone's name. -->
      <div class="props" id="props" aria-hidden="true">

        <div class="prop" data-prop="plane">
          <div class="shadow"><div class="rot">
            <svg viewBox="0 0 400 400">
              <path d="M184 160 L36 258 C30 263 31 271 40 272 L184 226 Z M216 160 L364 258 C370 263 369 271 360 272 L216 226 Z M186 318 L126 352 C121 356 122 362 129 362 L188 348 Z M214 318 L274 352 C279 356 278 362 271 362 L212 348 Z"/>
              <path d="M200 22 C214 22 219 50 219 80 L219 330 C219 352 210 372 200 378 C190 372 181 352 181 330 L181 80 C181 50 186 22 200 22 Z"/>
              <rect x="112" y="186" width="22" height="58" rx="11"/><rect x="266" y="186" width="22" height="58" rx="11"/>
            </svg>
          </div></div>
          <div class="body"><div class="rot">
            <svg viewBox="0 0 400 400">
              <defs>
                <linearGradient id="pl-body" x1="0" x2="1">
                  <stop offset="0" stop-color="#c3c9d0"/><stop offset=".2" stop-color="#eceef1"/>
                  <stop offset=".46" stop-color="#ffffff"/><stop offset=".72" stop-color="#f1f3f5"/>
                  <stop offset="1" stop-color="#b8bfc8"/>
                </linearGradient>
                <linearGradient id="pl-wing" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dde1e6"/>
                </linearGradient>
                <linearGradient id="pl-eng" x1="0" x2="1">
                  <stop offset="0" stop-color="#b3bac3"/><stop offset=".45" stop-color="#fafbfc"/><stop offset="1" stop-color="#c9cfd6"/>
                </linearGradient>
                <radialGradient id="pl-intake" cx=".5" cy=".5" r=".6">
                  <stop offset="0" stop-color="#2a3037"/><stop offset="1" stop-color="#6d7680"/>
                </radialGradient>
                <radialGradient id="pl-root" cx=".5" cy=".5" r=".5">
                  <stop offset="0" stop-color="#5d6773" stop-opacity=".22"/><stop offset="1" stop-color="#5d6773" stop-opacity="0"/>
                </radialGradient>
              </defs>
              <!-- wings -->
              <path d="M184 160 L36 258 C30 263 31 271 40 272 L184 226 Z" fill="url(#pl-wing)" stroke="#cdd2d8" stroke-width="1"/>
              <path d="M216 160 L364 258 C370 263 369 271 360 272 L216 226 Z" fill="url(#pl-wing)" stroke="#cdd2d8" stroke-width="1"/>
              <path d="M184 162 L38 259" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
              <path d="M216 162 L362 259" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
              <path d="M70 255 L184 218 M330 255 L216 218" stroke="#c4cad1" stroke-width=".8" opacity=".7"/>
              <!-- engines -->
              <rect x="112" y="186" width="22" height="58" rx="11" fill="url(#pl-eng)" stroke="#c3c9d0" stroke-width=".8"/>
              <rect x="266" y="186" width="22" height="58" rx="11" fill="url(#pl-eng)" stroke="#c3c9d0" stroke-width=".8"/>
              <ellipse cx="123" cy="190" rx="8.5" ry="4" fill="url(#pl-intake)"/>
              <ellipse cx="277" cy="190" rx="8.5" ry="4" fill="url(#pl-intake)"/>
              <!-- tailplane -->
              <path d="M186 318 L126 352 C121 356 122 362 129 362 L188 348 Z" fill="url(#pl-wing)" stroke="#cdd2d8" stroke-width="1"/>
              <path d="M214 318 L274 352 C279 356 278 362 271 362 L212 348 Z" fill="url(#pl-wing)" stroke="#cdd2d8" stroke-width="1"/>
              <!-- fuselage -->
              <ellipse cx="200" cy="195" rx="44" ry="40" fill="url(#pl-root)"/>
              <path d="M200 22 C214 22 219 50 219 80 L219 330 C219 352 210 372 200 378 C190 372 181 352 181 330 L181 80 C181 50 186 22 200 22 Z" fill="url(#pl-body)" stroke="#c7cdd4" stroke-width=".8"/>
              <path d="M193 60 Q200 54 207 60" stroke="#8f99a4" stroke-width="2.2" fill="none" stroke-linecap="round" opacity=".55"/>
              <ellipse cx="196" cy="74" rx="6" ry="26" fill="#fff" opacity=".8"/>
              <!-- fin seen from above -->
              <path d="M197.5 292 L202.5 292 L204 376 C202.5 381 197.5 381 196 376 Z" fill="#dfe3e8" stroke="#c3c9d0" stroke-width=".6"/>
            </svg>
          </div></div>
        </div>
      </div>
    </section>

  </main>

  <div id="tear-layer" class="tear-layer" aria-hidden="true"></div>

  <div id="who" class="who" role="dialog" aria-modal="true" aria-labelledby="who-title" hidden></div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
